summary-cn: 把一条真人出镜的口播视频，做成「人物缩成右下角圆头像 + 全幅动画讲清楚内容」的 1080×1920 竖屏成片，含剪辑、版式、逐场动画、合成、响度和六道自动验收；附「只做标题层」的画面文字规范。仅支持 Windows + 竖屏。
summary-en: Turn a talking-head video into a 1080x1920 9:16 explainer with a circular face-cam PiP and full-width animated scenes, including cutting, layout, per-scene animation, compositing, loudness, and six automated QA passes. Windows only, vertical 9:16 only.
desc-cn: >-
  面向做财经、商业、知识类竖屏口播的创作者。用户提供一条真人出镜的口播视频，
  确认成片时长、动画强度和人物画中画的形式后，Skill 依次完成：语音转写拿到每句话的
  精确时间（词级）、基于剪点表做出粗剪并生成原片↔成片时间映射、复转比对相似度、
  画面超分、确定版式（内容区/标题层/字幕带/圆头像/头部裁切）、把台词表拆成若干
  动画场景并逐场实现、批量渲染、与人物层合成、响度归一到 -14 LUFS，最后跑六道
  自动验收（越界与压圆、文字重叠、文字进字幕带、画布利用率、动画节拍与台词对齐、
  文字整体出界）。输出带圆头像画中画的 1080×1920 成片和对齐好的 SRT 字幕文件。
  字幕不烧进画面——用户后期在剪映里手工烧，位置和断句更准。
  平台边界：仅 Windows（脚本是纯 Python + ffmpeg，不依赖 PowerShell；字体取系统字体目录，
  可用 KOUBO_FONT_DIR 覆盖）；仅竖屏
  1080×1920 口播片；横屏模板未定。不适用于无人出镜的纯剪辑、多人对话、
  或只需要一段动效素材的场景。
desc-en: >-
  For creators making vertical finance, business, and knowledge talking-head videos.
  The user provides a talking-head recording and confirms target duration, animation
  intensity, and the face-cam treatment. The Skill then runs the full line: word-level
  speech transcription, cut decisions with a source-to-output time map and a
  re-transcription similarity check, upscaling, layout definition (content box, title
  band, subtitle band, circular face-cam, head crop), splitting the transcript into
  animated scenes implemented one by one, batch rendering, compositing with the speaker
  layer, loudness normalization to -14 LUFS, and six automated QA passes (overflow and
  face-cam collision, text overlap, text entering the subtitle band, canvas usage,
  beat-to-dialogue alignment, and overall text bounds). It outputs a 1080x1920 film with
  a circular face-cam PiP plus an aligned SRT. Subtitles are never burned in: the user
  burns them manually in their editor for accurate line breaks and placement.
  Scope: Windows only (tested baseline; pure Python + ffmpeg, no PowerShell dependency;
  system font directory, override with KOUBO_FONT_DIR), vertical
  1080x1920 talking-head films only (landscape templates are not defined yet). Not for
  pure editing of footage without a speaker, multi-person dialogue, or single
  motion-graphic assets.
